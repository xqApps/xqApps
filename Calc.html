.tpb.on{background:var(--acc);color:#111;border-color:var(--acc)}

.ang{min-width:52px}
.ang.deg{color:var(--acc);border-color:var(--acc)}
#fg{flex:1;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:1px;background:var(--bdr);overflow:hidden;min-height:0}
@media(max-width:799px){body{height:auto!important;min-height:100vh;overflow-y:auto!important}#fg{grid-template-columns:1fr!important;grid-template-rows:repeat(4,250px)!important;flex:none!important;height:auto!important;min-height:1000px!important;overflow:visible!important}}

  T:{kg:1,s:-2,A:-1},Wb:{kg:1,m:2,s:-2,A:-1},lm:{cd:1},lx:{cd:1,m:-2},
  Bq:{s:-1},Gy:{m:2,s:-2},Sv:{m:2,s:-2},kat:{mol:1,s:-1}});

window.onbeforeunload=()=>{if(DIRTY)return ""};
var stripComment=src=>{var i=0,n=src.length;while(i<n){var c=src[i];if(c==="'"||c==='"'){var q=c;i++;while(i<n&&src[i]!==q){if(src[i]==='\\')i++;i++}i++;continue}if(c==='/'&&src[i+1]==='/'){src=src.slice(0,i);break}i++}return src.trim()};
/* ── "expr to <unit>" forced conversion ── */
var convertTo=(val,tgt)=>{
  /* dates */
  if(isDt(val)){
    if(tgt==='ep'||tgt==='epoch')return val.ms/1000;
    if(tgt==='jd')return val.ms/86400000+2440587.5;
    if(tgt==='yf'){var ms=val.ms,dt=new Date(ms),yr=dt.getFullYear(),s0=new Date(yr,0,1).getTime(),e0=new Date(yr+1,0,1).getTime();return yr+(ms-s0)/(e0-s0)}
    throw'Cannot convert date to '+tgt}
  /* temperature targets */
  if(tgt==='\u00b0C'||tgt==='degC'||tgt==='dC'){
    if(!uEq(isUV(val)?val.u:unitOf(val),'K'))throw'Cannot convert '+(unitOf(val)||'dimensionless')+' to '+tgt;
    return{n:numOf(val)-273.15,u:'\u00b0C',_exact:true}}
  if(tgt==='\u00b0F'||tgt==='degF'){
    if(!uEq(isUV(val)?val.u:unitOf(val),'K'))throw'Cannot convert '+(unitOf(val)||'dimensionless')+' to '+tgt;
    return{n:numOf(val)*9/5-459.67,u:'\u00b0F',_exact:true}}
  /* general unit conversion */
  if(!isUV(val)&&!iN(val))throw'Cannot convert to '+tgt;
  var srcU=isUV(val)?val.u:'';
  if(bSig(expUnit(srcU))!==bSig(expUnit(tgt)))throw'Incompatible units: '+(srcU||'dimensionless')+' \u2192 '+tgt;
  var srcF=1;for(var _a of prsUnit(srcU)){var _r=expSym(_a.s,_a.p);srcF*=_r.f}
  var tgtF=1;for(var _a of prsUnit(tgt)){var _r=expSym(_a.s,_a.p);tgtF*=_r.f}
  return{n:numOf(val)*srcF/tgtF,u:tgt,_exact:true}};

var evalExpr=src=>{
  src=stripComment(src);src=normaliseAliases(src.trim());
  /* strip trailing "to <unit>" before tokenising */
  var _toM=src.match(/\bto\s+([a-zA-Z\u00b0\u03bc\u03a9][a-zA-Z0-9\u00b0\u03bc\u03a9\u00b7\/_]*(?:[/*][a-zA-Z0-9\u00b0\u03bc\u03a9\u00b7\/_]*)*)\s*$/),_toU=null;
  if(_toM){_toU=_toM[1];src=src.slice(0,src.length-_toM[0].length).trim()}
  src=preDt(src);if(!src)return undefined;
  var T=tok(src),pos=0;
  var pk=()=>T[pos]||null,eat=()=>T[pos++]||null,xp=v=>{var t=eat();if(!t||t.v!==v)throw'Expected "'+v+'"'};
  var tryPL=()=>{var sp=pos;eat();var ps=[];if(pk()&&pk().v===')'){eat();return ps}if(!pk()||pk().t!=='ID'){pos=sp;return null}ps.push(eat().v);while(pk()&&pk().v===','){eat();if(!pk()||pk().t!=='ID'){pos=sp;return null}ps.push(eat().v)}if(!pk()||pk().v!==')'){pos=sp;return null}eat();return ps};
  var pE=()=>{
    if(T[pos]&&T[pos].t==='ID'&&T[pos+1]&&T[pos+1].v==='='&&(!T[pos+2]||T[pos+2].v!=='=')){var nm=T[pos].v;pos+=2;var val=pE();VARS[nm]=val;if(!REPLAYING)buildVarSection();return val}
    if(T[pos]&&T[pos].t==='ID'&&T[pos+1]&&T[pos+1].v==='=>'){var param=T[pos].v;pos+=2;var bt=T.slice(pos);pos=T.length;return{_fn:true,params:[param],body:toksToStr(bt)}}
    if(T[pos]&&T[pos].v==='('){var sp2=pos,ps2=tryPL();if(ps2!==null&&pk()&&pk().v==='=>'){eat();var bt2=T.slice(pos);pos=T.length;return{_fn:true,params:ps2,body:toksToStr(bt2)}}pos=sp2}
    return pTn()};
  var pTn=()=>{var c=pOr();if(pk()&&pk().v==='?'){eat();var t=pOr();xp(':');var f=pOr();return vTruth(c)?t:f}return c};
  var pOr=()=>{var l=pAnd();while(pk()&&pk().v==='||'){eat();var r=pAnd();l=vTruth(l)||vTruth(r)}return l};
  var pAnd=()=>{var l=pCp();while(pk()&&pk().v==='&&'){eat();var r=pCp();l=vTruth(l)&&vTruth(r)}return l};
  var pCp=()=>{var l=pAd(),ops=['==','!=','<','>','<=','>='];while(pk()&&ops.includes(pk().v)){var op=eat().v,r=pAd();l=vCmp(l,r,op)}return l};
  var pAd=()=>{var l=pMl();while(pk()&&(pk().v==='+'||pk().v==='-')){var op=eat().v,r=pMl();l=op==='+'?vAdd(l,r):vSub(l,r)}return l};
  var pMl=()=>{var l=pPw();while(pk()&&(pk().v==='*'||pk().v==='/'||pk().v==='%')){var op=eat().v,r=pPw();l=op==='*'?vMul(l,r):op==='/'?vDiv(l,r):vMod(l,r)}return l};
  var pPw=()=>{var l=pUn();if(pk()&&(pk().v==='**'||pk().v==='^')){eat();var r=pPw();l=vPow(l,r)}return l};
  var pUn=()=>{if(pk()&&pk().v==='-'){eat();return vNeg(pUn())}if(pk()&&pk().v==='+'){eat();return pUn()}if(pk()&&pk().v==='!'){eat();return !vTruth(pUn())}return pPo()};
  var pPo=()=>{var v=pPr();while(pk()&&pk().t==='U'){var u=eat().v;v=addUnit(v,u)}return v};
  var pPr=()=>{
    var t=pk();if(!t)throw'Unexpected end';
    if(t.t==='N'){eat();return t.v}if(t.t==='CX'){eat();return{r:t.r,im:t.im}}if(t.t==='S'){eat();return t.v}
    if(t.t==='ID'){var nm=t.v;eat();
      if(pk()&&pk().v==='('){eat();var args=[];if(!pk()||pk().v!==')'){args.push(pE());while(pk()&&pk().v===','){eat();args.push(pE())}}xp(')');
        if(nm in FUNS)return FUNS[nm](...args);if(nm in VARS&&isFn(VARS[nm]))return callArrowFn(VARS[nm],args);if(nm in CONSTS)throw nm+' is a constant';throw'Unknown: '+nm}
      if(nm==='ans')return LAST[ACT]!=null?LAST[ACT]:0;if(/^ans[1-4]$/.test(nm))return LAST[+nm[3]-1]!=null?LAST[+nm[3]-1]:0;
      if(nm in VARS)return VARS[nm];if(nm in CONSTS)return CONSTS[nm];throw'Undefined: '+nm}
    if(t.v==='('){eat();var v=pE();xp(')');return v}
    if(t.v==='['){eat();var a=[];if(!pk()||pk().v!==']'){a.push(pE());while(pk()&&pk().v===','){eat();a.push(pE())}}xp(']');return a}
    throw'Unexpected: "'+t.v+'"'};
  if(!T.length)return undefined;var res=pE();if(pos<T.length)throw'Unexpected: "'+T[pos].v+'"';if(_toU!==null)res=convertTo(res,_toU);return res};

var HIST=[[],[],[],[]],EDIT_IDX=[-1,-1,-1,-1]; // State & field rendering
var FINP=[null,null,null,null],FLIV=[null,null,null,null]; // persistent input/live elements per field

var replayAll=()=>{
  REPLAYING=true;
  var sv=[0,1,2,3].map(fi=>FINP[fi]?FINP[fi].value:'');
  VARS={};LAST=[null,null,null,null];
  for(var fi=0;fi<4;fi++){
    for(var ei=0;ei<HIST[fi].length;ei++){var e=HIST[fi][ei];try{ACT=fi;var res=evalExpr(e.i);e.o=res;e.e=null;LAST[fi]=res;VARS.ans=res;VARS['ans'+(fi+1)]=res}catch(err){e.o=null;e.e=iS(err)?err:err.message}}
    renderHist(fi);
    if(FINP[fi])FINP[fi].value=sv[fi]}
  REPLAYING=false;buildVarSection();
  if(FINP[ACT])FINP[ACT].focus()};

var runEval=(src,fi)=>{
  src=src.trim();if(!src)return;
  try{ACT=fi;var res=evalExpr(src);HIST[fi].push({i:src,o:res,e:null});LAST[fi]=res;VARS.ans=res;VARS['ans'+(fi+1)]=res;DIRTY=true;if(!REPLAYING){buildVarSection();updateLoadHint()}}
  catch(err){var msg=iS(err)?err:err.message;HIST[fi].push({i:src,o:null,e:msg})}};

var renderHist=fi=>{ // Rebuild history rows — moves persistent inp/lv into the active row
  var el=$('fh'+fi),inp=FINP[fi],lv=FLIV[fi],eidx=EDIT_IDX[fi];
  if(inp&&inp.parentNode)inp.parentNode.removeChild(inp); // detach inp/lv from DOM before emptying (keeps their JS state intact)
  if(lv&&lv.parentNode)lv.parentNode.removeChild(lv);
  while(el.firstChild)el.removeChild(el.firstChild);
  HIST[fi].forEach((e,idx)=>{
    if(idx===eidx){
      var d=el.appendChild(document.createElement('div'));  // active edit row — contains the live input
      d.className='he active-edit editing-existing';
      d.appendChild(inp);d.appendChild(lv)
    }else{
      var d=el.appendChild(document.createElement('div'));d.className='he';
      d.addEventListener('click',()=>activateRow(fi,idx));
      var hi=d.appendChild(document.createElement('span'));hi.className='hi';hi.textContent=e.i;
      var heq=d.appendChild(document.createElement('span'));heq.className='heq';heq.textContent='=';
      var ho=d.appendChild(document.createElement('span'));
      if(e.e){ho.className='ho err';ho.textContent=e.e.slice(0,70)}
      else if(e.o!=null){ho.className='ho '+rCls(e.o);ho.innerHTML=fmtHTML(e.o)}
      else{ho.className='ho';ho.textContent='\u2014'}}});
  if(eidx===-1){var d=el.appendChild(document.createElement('div')); // new-entry row at bottom when not editing an existing entry
    d.className='he active-edit';
    d.appendChild(inp);d.appendChild(lv)}
  el.scrollTop=el.scrollHeight};

var activateRow=(fi,idx)=>{ // Activate an existing history row for editing
  EDIT_IDX[fi]=idx;
  var inp=FINP[fi],lv=FLIV[fi];
  inp.value=HIST[fi][idx].i;lv.innerHTML='';lv.className='flive';
  renderHist(fi);inp.focus();
  inp.dispatchEvent(new Event('input'))};

var activateFld=fi=>{for(var i=0;i<4;i++){var f=$('fld'+i);if(f)f.className='fld'+(i===fi?' active':'')}};


/* ── Build fields ── */
var buildFields=()=>{var fg=$('fg');for(var fi=0;fi<4;fi++){(fi=>{
  /* create persistent input + live-result elements for this field */
  var inp=$c('input');inp.className='finp';inp.id='fi'+fi;inp.type='text';
  inp.placeholder='expression  \u00b7  A = 5  \u00b7  9.81m/s2  \u00b7  f = x => x\u00b2';
  inp.spellcheck=false;inp.autocomplete='off';
  var lv=$c('span');lv.className='flive';lv.id='fl'+fi;
  FINP[fi]=inp;FLIV[fi]=lv;

  var ltimer=null;
  inp.addEventListener('input',()=>{clearTimeout(ltimer);ltimer=setTimeout(()=>{
    var src=inp.value.trim();if(!src){lv.innerHTML='';lv.className='flive';return}
    try{var res=evalExpr(src);if(res===undefined){lv.innerHTML='';return}lv.innerHTML=fmtHTML(res);lv.className='flive '+rCls(res)}
    catch(e){lv.innerHTML=esc('\u26a0 '+(iS(e)?e:e.message).slice(0,50));lv.className='flive err'}},160)});

  inp.addEventListener('keydown',ev=>{ACT=fi;
    if(ev.key==='Enter'){
      ev.preventDefault();var src=inp.value.trim();if(!src)return;
      src=normaliseAliases(src);inp.value=src;
      var eidx=EDIT_IDX[fi];
      if(eidx>=0){
        /* editing existing entry — replace and replay */
        src.split(';').map(s=>s.trim()).filter(Boolean).forEach((s,si)=>{
          if(si===0)HIST[fi][eidx].i=s;
          else HIST[fi].splice(eidx+si,0,{i:s,o:null,e:null})});
        replayAll();EDIT_IDX[fi]=-1;inp.value='';lv.innerHTML='';renderHist(fi);inp.focus()
      }else{
        /* new entry */
        src.split(';').map(s=>s.trim()).filter(Boolean).forEach(s=>runEval(s,fi));
        EDIT_IDX[fi]=-1;inp.value='';lv.innerHTML='';renderHist(fi);inp.focus()}}
    else if(ev.key==='Escape'){
      EDIT_IDX[fi]=-1;inp.value='';lv.innerHTML='';renderHist(fi);inp.focus()}
    else if(ev.key==='ArrowUp'){
      ev.preventDefault();
      var eidx=EDIT_IDX[fi],ni=eidx===-1?HIST[fi].length-1:eidx-1;
      if(ni>=0)activateRow(fi,ni)}
    else if(ev.key==='ArrowDown'){
      ev.preventDefault();
      var eidx=EDIT_IDX[fi];
      if(eidx===-1)return;
      if(eidx<HIST[fi].length-1)activateRow(fi,eidx+1);
      else{EDIT_IDX[fi]=-1;inp.value='';lv.innerHTML='';renderHist(fi);inp.focus()}}});

  inp.addEventListener('focus',()=>{ACT=fi;activateFld(fi)});

  /* field container */
  var fld=fg.appendChild($c('div'));fld.className='fld'+(fi===0?' active':'');fld.id='fld'+fi;
  fld.addEventListener('mousedown',e=>{
    if(e.target.closest('.he'))return;/* .he clicks handled by row */
    EDIT_IDX[fi]=-1;inp.value='';lv.innerHTML='';
    setTimeout(()=>{renderHist(fi);inp.focus()},0)});
  var hs=fld.appendChild($c('div'));hs.className='fhist';hs.id='fh'+fi;
  renderHist(fi);/* builds initial empty active-edit row */
})(fi)}};

var buildInfoPanel=()=>{var body=$('ip-body');while(body.firstChild)body.removeChild(body.firstChild);
  IP_DATA.forEach(sec=>{var s=body.appendChild($c('div'));s.className='ips';if(sec.id)s.id=sec.id;

var buildVarSection=()=>{var sec=$('ip-vars');if(!sec)return;while(sec.firstChild)sec.removeChild(sec.firstChild);
  var h=sec.appendChild($c('div'));h.className='ips-hdr';h.textContent='Current Variables';

  keys.forEach(k=>{var r=sec.appendChild($c('div'));r.className='ipr';var ke=r.appendChild($c('span'));ke.className='ipk';ke.textContent=k;var ve=r.appendChild($c('span'));ve.className='ipv';ve.textContent=fmtVal(VARS[k])})};

/* ── Save / Load ── */
var saveCalc=async()=>{try{var data={v:4,vars:VARS,hist:HIST.map(h=>h.map(e=>({i:e.i}))),angle:ANGLE};
  var bytes=new TextEncoder().encode(JSON.stringify(data));var cs=new CompressionStream('deflate-raw'),w=cs.writable.getWriter();w.write(bytes);w.close();
  var chunks=[],rd=cs.readable.getReader(),ch;while(!(ch=await rd.read()).done)chunks.push(ch.value);
  var tot=chunks.reduce((s,c)=>s+c.length,0),out=new Uint8Array(tot+4),off=4;out[0]=0xCA;out[1]=0x1C;out[2]=0x00;out[3]=0x04;
  chunks.forEach(c=>{out.set(c,off);off+=c.length});
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'application/octet-stream'}));a.download='calculator.cal';a.click();URL.revokeObjectURL(a.href);DIRTY=false}catch(e){alert('Save: '+e.message)}};
var _decomp=async(payload,fmt)=>{var ds=new DecompressionStream(fmt),w=ds.writable.getWriter();w.write(payload);w.close();var chunks=[],rd=ds.readable.getReader(),ch;while(!(ch=await rd.read()).done)chunks.push(ch.value);var tot=chunks.reduce((s,c)=>s+c.length,0),dec=new Uint8Array(tot),off=0;chunks.forEach(c=>{dec.set(c,off);off+=c.length});return dec};
var _applyCalData=data=>{
  if(data.angle){ANGLE=data.angle;var ab=$('btn-angle');ab.textContent=ANGLE.toUpperCase();ab.classList.toggle('deg',ANGLE==='deg')}
  VARS={};for(var i=0;i<4;i++){HIST[i]=[];EDIT_IDX[i]=-1;LAST[i]=null;(data.hist&&data.hist[i]||[]).forEach(e=>{if(e.i)HIST[i].push({i:e.i,o:null,e:null})})}
  replayAll();updateLoadHint()};
var loadCalc=async file=>{try{var buf=await file.arrayBuffer(),bytes=new Uint8Array(buf);
  /* ── binary .cal ── */
  if(bytes[0]===0xCA&&bytes[1]===0x1C){
    var payload=bytes.slice(4),dec;
    try{dec=await _decomp(payload,'deflate-raw')}catch(_){dec=await _decomp(payload,'deflate')}
    _applyCalData(JSON.parse(new TextDecoder().decode(dec)));return}
  /* ── plain JSON (any extension) ── */
  try{var txt=new TextDecoder().decode(bytes),data=JSON.parse(txt);
    if(data&&Array.isArray(data.hist)){_applyCalData(data);return}
    /* JSON but not a .cal payload — not a session file */
    throw'JSON does not contain a calc session (no hist array)'}
  catch(je){if(!(je instanceof SyntaxError))throw je}
  throw'Not a valid .cal or JSON session file'}catch(e){alert('Load: '+(e.message||e))}};
/* ── Load plain text / CSV into field 0 ── */
var loadText=async file=>{try{
  var txt=await file.text();
  var lines=txt.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length)return;
  HIST[0]=[];EDIT_IDX[0]=-1;LAST[0]=null;
  lines.forEach(l=>HIST[0].push({i:l,o:null,e:null}));
  replayAll();updateLoadHint()}catch(e){alert('Load text: '+(e.message||e))}};
/* ── Route a dropped / picked file to the right loader ── */
var _routeFile=f=>{
  if(!f)return;
  if(/\.cal$/i.test(f.name))return loadCalc(f);
  if(/\.(csv|txt)$/i.test(f.name))return loadText(f);
  /* unknown extension — sniff: try binary .cal, then JSON session, else text */
  f.arrayBuffer().then(buf=>{
    var b=new Uint8Array(buf);
    if(b[0]===0xCA&&b[1]===0x1C)return loadCalc(f);
    try{var d=JSON.parse(new TextDecoder().decode(b));if(d&&Array.isArray(d.hist))return loadCalc(f)}catch(_){}
    return loadText(f)})};
$on('btn-save','click',saveCalc);

var _mq=window.matchMedia('(prefers-color-scheme:light)'),
    _thOvr=null,
    applyTheme=t=>{var isLt=t==='light'; document.body.classList.toggle('light',isLt);$('btn-theme').textContent=isLt?'\u2600\uFE0F':'\uD83C\uDF19'},
    _thNow=()=>_thOvr||(_mq.matches?'light':'dark'),
    toggleTheme=()=>{_thOvr=_thNow()==='light'?'dark':'light';try{localStorage.setItem('calc-theme',_thOvr)}catch(e){}; applyTheme(_thOvr)};
